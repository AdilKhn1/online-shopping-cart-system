<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio | Collection</title>
    <style>
        :root {
            --bg-deep: #0f172a;        /* Slightly deeper for contrast */
            --bg-card: #1e293b;        /* Shifted for better depth */
            --text-bright: #f8fafc;
            --text-dim: #64748b;
            --accent: #22d3ee;
            --header-glass: rgba(15, 23, 42, 0.9);
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-bright);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== GLORIFIED HEADER ===== */
        header {
            padding: 24px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(34, 211, 238, 0.1); /* Subtle Cyan glow */
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h2 { 
            font-size: 20px; 
            font-weight: 800;
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin: 0; 
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        header a {
            color: var(--text-bright);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        header a:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
            background: rgba(34, 211, 238, 0.05);
        }

        /* ===== PRODUCT GRID ===== */
        .productcontainer {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 50px;
        }

        /* ===== PRODUCT CARD ===== */
        .product {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            transition: all 0.4s ease;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
        }

        .product:hover { 
            transform: translateY(-10px); 
            border-color: rgba(34, 211, 238, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .product .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .product .price {
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 30px;
            font-family: 'JetBrains Mono', monospace;
        }

        .product button {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            padding: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .product button:hover {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(34, 211, 238, 0.4);
        }

        /* ===== GLORIFIED FOOTER ===== */
        footer {
            margin-top: 100px;
            background: #070b14;
            padding: 80px 60px 40px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 60px;
            text-align: left;
        }

        .footer-logo h3 {
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 20px 0;
            color: var(--text-bright);
        }

        .footer-logo p {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.6;
            max-width: 300px;
        }

        .footer-links h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .footer-links div {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 12px;
            cursor: pointer;
        }

        .copyright {
            margin-top: 80px;
            text-align: center;
            font-size: 11px;
            color: #334155;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 40px;
        }

        @media (max-width: 768px) {
            .footer-content { grid-template-columns: 1fr; gap: 40px; text-align: center; }
            .footer-logo p { margin: 0 auto; }
        }
    </style>
</head>
<body>
    <header>
        <h2>MyShop</h2>
        <a href="usercart.html">Bag (0)</a>
    </header>

    <div class="productcontainer" id="products"></div>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <h3>Studio</h3>
                <p>Curating exceptional essentials for the modern lifestyle. Quality and design at the heart of everything we do.</p>
            </div>
            <div class="footer-links">
                <h4>Support</h4>
                <div>Shipping Info</div>
                <div>Returns</div>
                <div>Contact</div>
            </div>
            <div class="footer-links">
                <h4>Legal</h4>
                <div>Terms of Service</div>
                <div>Privacy Policy</div>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 Studio Essentials Collection
        </div>
    </footer>

    <script>
        fetch("/third.attempet.ecomm/products")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("products");
            data.forEach(p => {
                container.innerHTML += `
                    <div class="product">
                        <div class="title">${p.productName}</div>
                        <div class="price">₹${p.productPrice}</div>
                        <button onclick="addToCart(${p.productId})">Add to Bag</button>
                    </div>`;
            });
        });

        function addToCart(id) {
            fetch("/third.attempet.ecomm/AddToCart?product_id=" + id)
            .then(res => res.text()).then(msg => alert(msg));
        }
    </script>
</body>
</html>
