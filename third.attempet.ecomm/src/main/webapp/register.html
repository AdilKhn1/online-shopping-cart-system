<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
  }

  .box {
    width: 300px;
    margin: 100px auto;
    padding: 20px;
    background: white;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
  }

  input {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
  }

  button {
    width: 100%;
    padding: 8px;
    background: #28a745;
    color: white;
    border: none;
    cursor: pointer;
  }

  p {
    text-align: center;
    margin-top: 10px;
  }

  a {
    text-decoration: none;
    color: #007bff;
  }
</style>
</head>

<body>

<div class="box">
  <h2>Register</h2>

  <form action="register" method="get">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <p>Already have an account? <a href="login.html">Login</a></p>
</div>

</body>
</html>
